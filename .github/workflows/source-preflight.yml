name: iOS port toolchain preflight (no game assets)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/source-preflight.yml'
      - 'scripts/**'
      - 'README.md'
permissions:
  contents: read
jobs:
  toolchain:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout build-only scripts
        uses: actions/checkout@v4
      - name: Install .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Check Xcode and .NET
        run: |
          set -euo pipefail
          xcodebuild -version
          dotnet --info
      - name: Download public iOS port source only
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/jhaizhou-ops/sts2-ios.git "$RUNNER_TEMP/sts2-ios"
      - name: Compile open-source assembly weaver
        run: |
          set -euo pipefail
          dotnet build "$RUNNER_TEMP/sts2-ios/src/STS2Weaver/STS2Weaver.csproj" -c Release
      - name: Exercise assembly parser and Windows layout shim
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/smoke"
          cat > "$RUNNER_TEMP/smoke/Test.csproj" <<'XML'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net9.0</TargetFramework></PropertyGroup>
          </Project>
          XML
          cat > "$RUNNER_TEMP/smoke/Fixture.cs" <<'CS'
          namespace Smoke {
            public static class Fixture {
              public static void Ping() { }
            }
          }
          CS
          dotnet build "$RUNNER_TEMP/smoke/Test.csproj" -c Release
          printf '%s\n' '{"patches":[{"targetType":"Smoke.Fixture","targetMethod":"Ping"}]}' > "$RUNNER_TEMP/smoke/manifest.json"
          python3 scripts/sts2_preflight.py "$RUNNER_TEMP/smoke/bin/Release/net9.0/Test.dll" "$RUNNER_TEMP/smoke/manifest.json"
          mkdir -p "$RUNNER_TEMP/win-game/data_sts2_windows_x86_64"
          cp "$RUNNER_TEMP/smoke/bin/Release/net9.0/Test.dll" "$RUNNER_TEMP/win-game/data_sts2_windows_x86_64/sts2.dll"
          printf '%s' smoke > "$RUNNER_TEMP/win-game/SlayTheSpire2.pck"
          python3 scripts/stage_windows_game.py "$RUNNER_TEMP/win-game" "$RUNNER_TEMP/staged"
          test -L "$RUNNER_TEMP/staged/Resources/data_sts2_macos_arm64/sts2.dll"
          test -L "$RUNNER_TEMP/staged/Resources/Slay the Spire 2.pck"
      - name: Validate port patch manifest
        env:
          PORT_PATH: ${{ runner.temp }}/sts2-ios
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          p=Path(os.environ['PORT_PATH'])/'src/STS2MobileIos/manifest.json'
          m=json.loads(p.read_text())
          assert isinstance(m.get('patches'),list) and len(m['patches'])>=30
          assert all(x.get('targetType') and x.get('targetMethod') for x in m['patches'])
          print(f"Found {len(m['patches'])} patch targets in upstream manifest")
          print('Source-only preflight succeeded. No IPA was produced.')
          PYCODE
